[package]
name = "gal-editor"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Gallery's photo editor engine: Grainhouse's editing library behind a small JNI bridge"

[lib]
name = "gal_editor"
crate-type = ["cdylib"]

[dependencies]
# Editing, film looks and export only: Gallery's copy of the library (no window, upscaling or AI models).
grainhouse = { path = "../grainhouse" }
jni = { version = "0.21", default-features = false }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 4
lto = "thin"
strip = true
panic = "unwind"
