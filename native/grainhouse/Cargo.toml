[package]
name = "grainhouse"
version = "1.0.2"
description = "Grainhouse's editing library, as Gallery's editor uses it (see VENDORED.md)"
license = "AGPL-3.0-only"
repository = "https://github.com/jegly/grainhouse"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rawler = "0.8.0"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1.10.0"
